[project]
name = "tracerpyx"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "parser*", "graph*", "symbol_resolver*", "scanning_matcher*", "metadata_cache*", "reporter_command*", "integrations*", "sandbox*", "ai_agent*", "backend*"]
